name: Auto Sync Upstream
on:
  schedule:
    - cron: '0 6 * * *'      # 每天 UTC 6 点（北京时间 14 点）跑一次
  workflow_dispatch:         # 允许在 Actions 页手动点一下立即同步
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/litaolemo/xtquant_big_convert.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit || true
          git push origin main
